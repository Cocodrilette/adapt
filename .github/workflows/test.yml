name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fastapi-version: ["0.115.*", "0.140.*"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "fastapi==${{ matrix.fastapi-version }}"

      - name: Run tests
        run: python -m pytest tests/ -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pip-audit
        # PYSEC-2026-* below are pillow CVEs fixed only in pillow>=12, which
        # moviepy 2.2.1 blocks via its own `pillow<12.0` pin (see
        # SECURITY.md). Remove these ignores once moviepy allows pillow 12.
        run: |
          python -m pip install pip-audit
          python -m pip-audit \
            --ignore-vuln PYSEC-2026-165 \
            --ignore-vuln PYSEC-2026-2249 \
            --ignore-vuln PYSEC-2026-2250 \
            --ignore-vuln PYSEC-2026-2251 \
            --ignore-vuln PYSEC-2026-2252 \
            --ignore-vuln PYSEC-2026-2253 \
            --ignore-vuln PYSEC-2026-2254 \
            --ignore-vuln PYSEC-2026-2255 \
            --ignore-vuln PYSEC-2026-2256 \
            --ignore-vuln PYSEC-2026-2257 \
            --ignore-vuln PYSEC-2026-2874 \
            --ignore-vuln PYSEC-2026-3451 \
            --ignore-vuln PYSEC-2026-3453 \
            --ignore-vuln PYSEC-2026-3454 \
            --ignore-vuln PYSEC-2026-3493 \
            --ignore-vuln PYSEC-2026-3494 \
            --ignore-vuln PYSEC-2026-3495 \
            --ignore-vuln PYSEC-2026-3496
